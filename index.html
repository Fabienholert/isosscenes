<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews ]"
    />
    <link href="/src/assets/styles.css" rel="stylesheet" />
    <title>Isosscenes</title>
    <!-- Rich Snippet -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Isosscenes",
        "image": "./public/logo.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "4 impasse de la mathe",
          "addressLocality": "Saint Colomban",
          "addressRegion": "Loire Atlantique",
          "postalCode": "44310",
          "addressCountry": "FR"
        },
        "url": "https://github.com/Fabienholert",
        "telephone": "+33658529553",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "saturday",
              "sunday"
            ],
            "opens": "00:01",
            "closes": "00:00"
          }
        ],
        "priceRange": "média"
      }
    </script>
    <!-- ================================================== -->
    <!-- ============ BALISES META POUR isosscenes ============ -->
    <!-- ================================================== -->

    <!-- ========== BASE ========== -->

    <!-- ========== Schema.org (pour Google Search / Rich Results) ========== -->
    <!-- Ces balises aident Google à comprendre le contenu de ta page -->
    <meta
      itemprop="name"
      content="[Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews]"
    />
    <meta
      itemprop="description"
      content="[Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews]"
    />
    <meta
      itemprop="image"
      content="[URL de l'image principale de la page/article]"
    />

    <!-- ========== Twitter Card Tags ========== -->
    <!-- Utilise une grande image pour plus d'impact visuel -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Remplace @isosscenes par ton VRAI compte Twitter si tu en as un, sinon supprime cette ligne -->
    <meta name="twitter:site" content="@isosscenes" />
    <!-- Optionnel : Compte Twitter du créateur/auteur de l'article. Peut être le même que twitter:site. Remplace ou supprime. -->
    <meta name="twitter:creator" content="@isosscenes" />
    <!-- Titre affiché sur Twitter (max 70 caractères recommandés) -->
    <meta
      name="twitter:title"
      content="[Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews]"
    />
    <!-- Description affichée sur Twitter (max 200 caractères recommandés) -->
    <meta
      name="twitter:description"
      content="[Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews]"
    />

    <meta
      name="twitter:image"
      content="[URL de l'image principale de la page/article]"
    />
    <meta
      name="twitter:image:alt"
      content="[Description alternative de l'image]"
    />
    <!-- Important pour l'accessibilité -->

    <!-- ========== Open Graph Tags (Facebook, Pinterest, LinkedIn, etc.) ========== -->
    <!-- Titre affiché lors du partage -->
    <meta
      property="og:title"
      content="[Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews]"
    />
    <!-- Type de contenu. 'article' pour les chroniques/interviews, 'website' pour la page d'accueil -->
    <meta property="og:type" content="article" />
    <!-- ou "website" pour la page d'accueil -->
    <!-- URL canonique de la page spécifique -->
    <meta property="og:url" content="[URL complète de la page/article]" />
    <!-- URL absolue (https://...) -->
    <!-- Nom de ton site -->
    <meta property="og:site_name" content="isosscenes" />
    <!-- Description affichée lors du partage (environ 200 caractères recommandés) -->
    <meta
      property="og:description"
      content="[Média musical qui touche la scène locale pour le moment 44, 85, venez découvrir les photos, chroniques d'album, interviews]"
    />
    <!-- Image principale affichée lors du partage. URL absolue. -->
    <!-- Taille recommandée : 1200x630 pixels -->
    <meta
      property="og:image"
      content="[URL de l'image principale de la page/article]"
    />
    <meta
      property="og:image:secure_url"
      content="[URL https de l'image principale de la page/article]"
    />
    <!-- Si disponible en HTTPS -->
    <meta property="og:image:type" content="image/jpeg" />
    <!-- ou image/png, image/gif -->
    <meta property="og:image:width" content="1200" />
    <!-- Optionnel mais recommandé -->
    <meta property="og:image:height" content="630" />
    <!-- Optionnel mais recommandé -->
    <meta property="og:image:alt" content="[logo de Isosscenes]" />
    <!-- Important pour l'accessibilité -->
    <!-- Langue du contenu (format ISO 639-1 + ISO 3166-1) -->
    <meta property="og:locale" content="fr_FR" />

    <!-- Spécifique aux articles (optionnel mais recommandé) -->
    <!-- Lien vers la page Facebook de l'éditeur/site -->
    <meta
      property="article:publisher"
      content="https://www.facebook.com/profile.php?id=61572540496960"
    />
    <!-- ================================================== -->
    <!-- ============ FIN BALISES META isosscenes ============ -->
    <!-- ================================================== -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
